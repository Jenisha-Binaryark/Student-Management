name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: signup_user
        options: >-
          --health-cmd="pg_isready -U postgres -d signup_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: signup_user
          DB_USER: postgres
          DB_PASSWORD: ci-test-password
        run: python -m unittest discover -s tests -v
