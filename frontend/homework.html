<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/homework.css') }}?v=student-3">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/sidebar.css') }}?v=student-3">
    <title>Smartech Homework</title>
</head>
<body>
    <div class="homework">
    <div id="sidebar-placeholder"></div>

        <div class="main">

            <div class="page-head">
                <h1>Homework</h1>
                <p>Everything your teachers have assigned, in one place.</p>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="assigned">Assigned <span class="badge" id="badge-assigned">0</span></button>
                <button class="tab" data-tab="missing">Missing <span class="badge" id="badge-missing">0</span></button>
                <button class="tab" data-tab="done">Done <span class="badge" id="badge-done">0</span></button>
            </div>

            <section class="panel active" id="panel-assigned"></section>
            <section class="panel" id="panel-missing"></section>
            <section class="panel" id="panel-done"></section>
        </div>
    </div>
<script src="{{ url_for('static', filename='src/homework.js') }}?v=student-2"></script>
</body>
</html>
