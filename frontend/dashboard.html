<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smartech Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/sidebar.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='/styles/dashboard.css') }}">
</head>
<body>

<div class="dashboard">
  <div id="sidebar-placeholder"></div>

  <div class="main">

    <div class="grid">

      <div class="card">
        <h3>Linked Teachers</h3>
        <div id="dashboard-teacher-list">
          <p class="empty-hint">Loading…</p>
        </div>
      </div>

      <div class="card">
        <h3>Recent notes</h3>
        <div id="dashboard-recent-notes">
          <p class="empty-hint">Loading…</p>
        </div>
      </div>

      <div class="stats-col">
        <div class="stat-card">
          <h4>Attendance</h4>
          <p class="stat-sub">Last 30 days</p>
          <div class="ring-wrap">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
              <circle id="attendanceRing" cx="40" cy="40" r="34" fill="none" stroke="#d1567f" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
            </svg>
            <div class="ring-pct" id="attendancePct">–</div>
          </div>
        </div>

        <div class="stat-card">
          <a href="{{ url_for('homework_page') }}" class="text-decoration-none">
            <h4>Homework</h4>
            <div class="ring-wrap">
              <svg width="80" height="80" viewBox="0 0 80 80">
                <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
                <circle id="homeworkRing" cx="40" cy="40" r="34" fill="none" stroke="#5aada0" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
              </svg>
              <div class="ring-pct" id="homeworkPct">–</div>
            </div>
          </a>
        </div>

        <div class="stat-card">
          <h4>Performance</h4>
          <p class="stat-sub">Across recorded marks</p>
          <div class="ring-wrap">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>
              <circle id="performanceRing" cx="40" cy="40" r="34" fill="none" stroke="#e0aa4e" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
            </svg>
            <div class="ring-pct" id="performancePct">–</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Recent attendance</h3>
        <div id="dashboard-attendance-history"><p class="empty-hint">Loading…</p></div>
      </div>

      <div class="schedule-row">
        <div class="card calendar">
          <h3>My schedule</h3>
          <div class="cal-nav">
            <span id="cal-prev" style="cursor:pointer;">‹</span>
            <span id="cal-month-label"></span>
            <span id="cal-next" style="cursor:pointer;">›</span>
          </div>
          <table id="cal-table">
            <tr><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th></tr>
          </table>
        </div>
        <div class="card">
          <h3>Today's lessons</h3>
          <div class="lesson-list" id="dashboard-today-schedule">
            <p class="empty-hint">Loading…</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='/src/dashboard.js') }}"></script>
</body>
</html>
