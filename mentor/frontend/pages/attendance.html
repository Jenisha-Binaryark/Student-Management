<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smartech — Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('mentor_pages.static', filename='styles/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/sidebar.css') }}">
<link rel="stylesheet" href="{{ url_for('mentor_pages.static', filename='styles/mentor_sidebar.css') }}">
</head>
<body>
<div class="dashboard">
  <div id="sidebar-placeholder"></div>

  <div class="main">
    <div class="page-head">
      <h1>Attendance</h1>
      <p id="attendanceActiveClass">Select a class above to take attendance.</p>
    </div>

    <div class="notes-layout">

      <div class="card">
        <h3>Class roster</h3>
        <p class="modal-message" id="rosterMessage"></p>
        <form id="addStudentForm">
          <label for="studentEmail">Student email</label>
          <input type="email" id="studentEmail" placeholder="student@email.com">
          <div class="panel-actions">
            <button type="submit" class="btn-primary">Add student</button>
          </div>
        </form>
        <div class="roster-list" id="rosterList">
          <p class="empty-hint">Select a class above to see its roster.</p>
        </div>
      </div>

      <div class="card">
        <h3>Mark attendance</h3>
        <div class="attendance-toolbar">
          <label for="attendanceDate">Date</label>
          <input type="date" id="attendanceDate">
        </div>
        <p class="modal-message" id="attendanceMessage"></p>
        <div class="attendance-list" id="attendanceList">
          <p class="empty-hint">Select a class above to take attendance.</p>
        </div>
        <div class="panel-actions">
          <button type="button" class="btn-primary" id="saveAttendanceBtn">Save attendance</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="{{ url_for('mentor_pages.static', filename='src/mentor_common.js') }}"></script>
<script src="{{ url_for('mentor_pages.static', filename='src/attendance.js') }}"></script>
</body>
</html>
