<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smartech — Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/sidebar.css') }}">
<link rel="stylesheet" href="{{ url_for('mentor_pages.static', filename='styles/mentor_sidebar.css') }}">
</head>
<body>
<div class="dashboard">
  <div id="sidebar-placeholder"></div>

  <div class="main">
    <div class="page-head">
      <h1>Timetable</h1>
      <p id="timetableActiveClass">Select a class above to see its schedule.</p>
    </div>

    <div class="notes-layout">

      <div class="card">
        <h3>Add a class slot</h3>
        <p class="modal-message" id="slotMessage"></p>
        <form id="slotForm">
          <label for="slotDay">Day</label>
          <select id="slotDay">
            <option value="Mon">Monday</option>
            <option value="Tue">Tuesday</option>
            <option value="Wed">Wednesday</option>
            <option value="Thu">Thursday</option>
            <option value="Fri">Friday</option>
            <option value="Sat">Saturday</option>
            <option value="Sun">Sunday</option>
          </select>

          <label for="slotSubject">Subject</label>
          <input type="text" id="slotSubject" placeholder="e.g. Data Structures">

          <div class="field-row">
            <div>
              <label for="slotStart">Start time</label>
              <input type="time" id="slotStart">
            </div>
            <div>
              <label for="slotEnd">End time</label>
              <input type="time" id="slotEnd">
            </div>
          </div>

          <label for="slotRoom">Room (optional)</label>
          <input type="text" id="slotRoom" placeholder="e.g. Lab 2">

          <div class="panel-actions">
            <button type="submit" class="btn-primary">Add slot</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h3>Weekly schedule</h3>
        <div class="timetable-week" id="timetableWeek">
          <p class="empty-hint">Select a class above to see its schedule.</p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="{{ url_for('mentor_pages.static', filename='src/mentor_common.js') }}"></script>
<script src="{{ url_for('mentor_pages.static', filename='src/timetable.js') }}"></script>
</body>
</html>
